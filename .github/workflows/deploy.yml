name: Deploy PartyKit

on:
  push:
    branches:
      - master
    paths:
      - "party/**"
      - "shared/**"
      - "partykit.json"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  deploy-partykit:
    if: ${{ secrets.PARTYKIT_LOGIN != '' && secrets.PARTYKIT_TOKEN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Deploy PartyKit
        run: npx partykit deploy
        env:
          PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
